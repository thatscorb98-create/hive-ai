name: Apply live sync patch

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply patch
        run: |
          python3 - <<'PY'
          from pathlib import Path

          models = Path('app/src/main/java/com/hive/agents/data/Models.kt')
          s = models.read_text()
          s = s.replace(
              '    val buyingGuide: String = "Digital goods, AI-run services, websites, graphics, copy and automation for local businesses."\n)',
              '    val buyingGuide: String = "Digital goods, AI-run services, websites, graphics, copy and automation for local businesses.",\n'
              '    /** Optional live-sync relay (the Hive Station dashboard). Blank means off. */\n'
              '    val syncUrl: String = "",\n'
              '    /** Room key for the relay. Stripped from the snapshot before it is uploaded. */\n'
              '    val syncKey: String = ""\n)'
          )
          assert 'val syncUrl' in s, 'Models.kt did not match'
          models.write_text(s)

          http = Path('app/src/main/java/com/hive/agents/net/Http.kt')
          s = http.read_text()
          s = s.replace(
              '    suspend fun get(',
              '    suspend fun putJson(\n'
              '        url: String,\n'
              '        body: String,\n'
              '        headers: Map<String, String> = emptyMap()\n'
              '    ): String = withContext(Dispatchers.IO) {\n'
              '        val builder = Request.Builder().url(url).put(body.toRequestBody(JSON_MEDIA))\n'
              '        headers.forEach { (k, v) -> builder.header(k, v) }\n'
              '        client.newCall(builder.build()).execute().use { response ->\n'
              '            val text = response.body?.string().orEmpty()\n'
              '            if (!response.isSuccessful) throw HttpException(response.code, text)\n'
              '            text\n'
              '        }\n'
              '    }\n\n'
              '    suspend fun get('
          )
          assert 'putJson' in s, 'Http.kt did not match'
          http.write_text(s)

          Path('app/src/main/java/com/hive/agents/net/LiveSync.kt').write_text('''package com.hive.agents.net

import com.hive.agents.data.HiveState
import com.hive.agents.data.HiveStore
import kotlinx.coroutines.CoroutineScope
import kotlinx.coroutines.Dispatchers
import kotlinx.coroutines.SupervisorJob
import kotlinx.coroutines.delay
import kotlinx.coroutines.flow.MutableStateFlow
import kotlinx.coroutines.flow.StateFlow
import kotlinx.coroutines.flow.asStateFlow
import kotlinx.coroutines.flow.collectLatest
import kotlinx.coroutines.launch
import kotlinx.serialization.encodeToString
import kotlinx.serialization.json.Json
import java.text.SimpleDateFormat
import java.util.Date
import java.util.Locale

/**
 * Pushes a snapshot to the Hive Station relay. Push-only: the phone stays the source of truth,
 * and the dashboard reads the relay instead of waiting for a state file.
 */
object LiveSync {

    private val json = Json {
        encodeDefaults = true
        ignoreUnknownKeys = true
    }

    private const val MAX_BYTES = 4 * 1024 * 1024
    private const val MIN_KEY_LENGTH = 16

    private val _status = MutableStateFlow("")
    /** Human-readable result of the latest push, shown on the settings screen. */
    val status: StateFlow<String> = _status.asStateFlow()

    private var scope: CoroutineScope? = null

    fun start(store: HiveStore) {
        if (scope != null) return
        scope = CoroutineScope(SupervisorJob() + Dispatchers.IO).also { created ->
            created.launch {
                store.state.collectLatest { snapshot ->
                    if (!configured(snapshot)) return@collectLatest
                    // Let a burst of state writes settle before uploading.
                    delay(1_500)
                    runCatching { push(snapshot) }
                        .onSuccess {
                            val time = SimpleDateFormat("HH:mm:ss", Locale.US).format(Date())
                            _status.value = "Live sync pushed at $time"
                        }
                        .onFailure { error ->
                            _status.value = "Live sync failed: ${error.message ?: "upload failed"}"
                        }
                }
            }
        }
    }

    fun configured(state: HiveState): Boolean =
        state.settings.syncUrl.trim().startsWith("https://") &&
            state.settings.syncKey.trim().length >= MIN_KEY_LENGTH

    /** Uploads [state], leaving the relay URL and key out of the stored document. */
    suspend fun push(state: HiveState) {
        val url = state.settings.syncUrl.trim()
        val key = state.settings.syncKey.trim()
        check(configured(state)) { "Live sync needs an https URL and a key of at least 16 characters." }

        val clean = state.copy(settings = state.settings.copy(syncUrl = "", syncKey = ""))
        val body = json.encodeToString(clean)
        check(body.toByteArray().size <= MAX_BYTES) { "Snapshot is larger than 4 MB." }

        Http.putJson(url, body, mapOf("x-hive-key" to key))
    }
}
''')

          store = Path('app/src/main/java/com/hive/agents/data/HiveStore.kt')
          s = store.read_text()
          s = s.replace(
              'import java.io.File',
              'import com.hive.agents.net.LiveSync\nimport java.io.File'
          )
          s = s.replace(
              '        ModelUsage.install { inputTokens, outputTokens ->\n'
              '            update { it.withModelCall(inputTokens = inputTokens, outputTokens = outputTokens) }\n'
              '        }',
              '        ModelUsage.install { inputTokens, outputTokens ->\n'
              '            update { it.withModelCall(inputTokens = inputTokens, outputTokens = outputTokens) }\n'
              '        }\n'
              '        // Optional push to the Hive Station relay; does nothing until a URL and key are saved.\n'
              '        LiveSync.start(this)'
          )
          assert 'LiveSync.start(this)' in s, 'HiveStore.kt did not match'
          store.write_text(s)

          screen = Path('app/src/main/java/com/hive/agents/ui/screens/SettingsScreen.kt')
          s = screen.read_text()
          s = s.replace(
              '    var blocklist by remember(state.settings) { mutableStateOf(state.settings.emailBlocklist) }',
              '    var blocklist by remember(state.settings) { mutableStateOf(state.settings.emailBlocklist) }\n'
              '    var syncUrl by remember(state.settings) { mutableStateOf(state.settings.syncUrl) }\n'
              '    var syncKey by remember(state.settings) { mutableStateOf(state.settings.syncKey) }\n'
              '    val liveSyncStatus by com.hive.agents.net.LiveSync.status.collectAsState()'
          )
          header = '            SectionHeader("MODEL", "free NVIDIA tier - Hive checks the live catalog")'
          block = '''        item {
                      SectionHeader("LIVE SYNC", "optional - pushes a snapshot to your dashboard")
                      LabeledField("Sync URL", syncUrl) { syncUrl = it }
                      Spacer(Modifier.height(6.dp))
                      LabeledField("Sync key", syncKey, secret = true) { syncKey = it }
                      Spacer(Modifier.height(4.dp))
                      Text(
                          "Paste the URL and key from the dashboard's Settings -> Live sync card. Every change " +
                              "is pushed about two seconds after it settles, and the dashboard refreshes every " +
                              "four seconds. The key stays on this device; it is removed from the uploaded snapshot.",
                          fontSize = 10.sp,
                          color = TextDim
                      )
                      Spacer(Modifier.height(8.dp))
                      Button(onClick = {
                          onSaveSettings(
                              state.settings.copy(syncUrl = syncUrl.trim(), syncKey = syncKey.trim())
                          )
                      }) { Text("Save live sync") }
                      if (syncKey.isNotBlank() && syncKey.trim().length < 16) {
                          Spacer(Modifier.height(4.dp))
                          Text("The key must be at least 16 characters.", fontSize = 10.sp, color = Amber)
                      }
                      if (liveSyncStatus.isNotBlank()) {
                          Spacer(Modifier.height(4.dp))
                          Text(liveSyncStatus, fontSize = 10.sp, color = TextDim)
                      }
                  }

          '''
          s = s.replace('        item {\n' + header, block + '        item {\n' + header)
          assert 'LIVE SYNC' in s, 'SettingsScreen.kt did not match'
          if 'import androidx.compose.runtime.collectAsState' not in s:
              s = s.replace(
                  'import androidx.compose.runtime.Composable',
                  'import androidx.compose.runtime.Composable\nimport androidx.compose.runtime.collectAsState'
              )
          screen.write_text(s)

          gradle = Path('app/build.gradle.kts')
          s = gradle.read_text()
          s = s.replace('versionCode = 25', 'versionCode = 26').replace('versionName = "2.14.0"', 'versionName = "2.15.0"')
          assert 'versionName = "2.15.0"' in s, 'build.gradle.kts did not match'
          gradle.write_text(s)
          print('patched ok')
          PY

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/hive/agents/data/Models.kt \
                  app/src/main/java/com/hive/agents/data/HiveStore.kt \
                  app/src/main/java/com/hive/agents/net/Http.kt \
                  app/src/main/java/com/hive/agents/net/LiveSync.kt \
                  app/src/main/java/com/hive/agents/ui/screens/SettingsScreen.kt \
                  app/build.gradle.kts
          git diff --cached --stat
          git commit -m "feat: push live snapshots to the dashboard relay"
          git push origin HEAD:main
