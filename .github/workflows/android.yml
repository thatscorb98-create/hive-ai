name: Android APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version name for the APK and release tag
        required: true
        default: "2.15.1"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      VERSION: ${{ inputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.HIVE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "No signing key secret; this build will use a throwaway debug key."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/hive-release.p12"
          echo "HIVE_KEYSTORE=$RUNNER_TEMP/hive-release.p12" >> "$GITHUB_ENV"

      - name: Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools" > /dev/null

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        env:
          HIVE_STORE_PASSWORD: ${{ secrets.HIVE_STORE_PASSWORD }}
          HIVE_KEY_ALIAS: ${{ secrets.HIVE_KEY_ALIAS }}
          HIVE_KEY_PASSWORD: ${{ secrets.HIVE_KEY_PASSWORD }}
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verify signature
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/debug/app-debug.apk | head -6

      - name: Stage APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk "out/hive-$VERSION-debug.apk"
          sha256sum "out/hive-$VERSION-debug.apk" > "out/hive-$VERSION-debug.apk.sha256"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          target_commitish: main
          name: Hive ${{ inputs.version }}
          body: |
            Counts real model calls and token usage per hour, and can push snapshots to the Hive
            Station dashboard relay so it no longer waits on an exported file.

            - Settings -> LIVE SYNC takes the relay URL and a 16-64 character room key. The app
              uploads a snapshot about two seconds after a change settles; the dashboard reads it
              every four seconds.
            - The relay key is removed from the uploaded document and stays on the phone.
            - Model calls count successful chat-completions requests. Retries are separate
              requests and count separately.
            - Token counts come from the provider's `usage` object and stay 0 when it is absent.
            - Usage is kept as 168 hourly buckets (about seven days); capped on every write.

            Built with a stable CI signing key, so later Hive updates install over this one.
            If you are coming from a build signed with an older key, Android requires one
            uninstall first. Debuggable and not tested on a device in CI.
          files: |
            out/hive-${{ inputs.version }}-debug.apk
            out/hive-${{ inputs.version }}-debug.apk.sha256
          overwrite_files: true
          make_latest: true
