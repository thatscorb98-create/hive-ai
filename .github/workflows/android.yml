name: Android APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version name for the APK and release tag
        required: true
        default: "2.15.0"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      VERSION: ${{ inputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools" > /dev/null

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Stage APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk "out/hive-$VERSION-debug.apk"
          sha256sum "out/hive-$VERSION-debug.apk" > "out/hive-$VERSION-debug.apk.sha256"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          target_commitish: main
          name: Hive ${{ inputs.version }} - live dashboard sync
          body: |
            Counts real model calls and token usage per hour, and can push snapshots to the Hive
            Station dashboard relay so it no longer waits on an exported file.

            - Settings -> LIVE SYNC takes the relay URL and a 16-64 character room key. The app
              uploads a snapshot about two seconds after a change settles; the dashboard reads it
              every four seconds.
            - The relay key is removed from the uploaded document and stays on the phone.
            - Model calls count successful chat-completions requests. Retries are separate
              requests and count separately.
            - Token counts come from the provider's `usage` object and stay 0 when it is absent.
            - Usage is kept as 168 hourly buckets (about seven days); capped on every write.

            Debug-signed, so it may not install over an older build with a different signing
            key (uninstall the old app first). Not tested on a device in CI.
          files: |
            out/hive-${{ inputs.version }}-debug.apk
            out/hive-${{ inputs.version }}-debug.apk.sha256
          overwrite_files: true
          make_latest: true
